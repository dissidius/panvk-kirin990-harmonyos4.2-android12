name: PanVK HarmonyOS 4.2 experimental ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [harmony42-experimental-build, harmony42-atom72-test, harmony42-rotation-compat, harmony42-rotation-universal]
    paths:
      - '.github/workflows/build-harmony42.yml'
      - 'harmony42/**'
      - 'scripts/prepare-tree.sh'
      - 'scripts/build-android.sh'

permissions:
  contents: read

concurrency:
  group: panvk-harmony42-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PANVK_JOBS: '4'
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - name: Checkout source fork
        uses: actions/checkout@v4

      - name: Install host build requirements
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip python3-venv \
            ninja-build meson pkg-config cmake curl unzip zip xxd \
            clang-18 llvm-18-dev libclang-18-dev libclc-18-dev \
            llvm-spirv-18 libllvmspirvlib-18-dev \
            bindgen-0.71 cbindgen flex bison \
            glslang-tools libdrm-dev libexpat1-dev libelf-dev \
            libwayland-dev wayland-protocols libx11-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxshmfence-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxkbcommon-dev zlib1g-dev
          sudo ln -sf /usr/bin/bindgen-0.71 /usr/local/bin/bindgen
          bindgen --version
          python3 -m venv /tmp/panvk-venv
          /tmp/panvk-venv/bin/pip install --upgrade meson ninja mako pyyaml packaging
          echo '/tmp/panvk-venv/bin' >> "$GITHUB_PATH"

      - name: Download Android NDK r28c
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          sudo unzip -q /tmp/android-ndk.zip -d /opt
          echo 'ANDROID_NDK_ROOT=/opt/android-ndk-r28c' >> "$GITHUB_ENV"

      - name: Prepare pinned Mesa 27 and PanVK 1.3.0 patches
        run: sh scripts/prepare-tree.sh "$GITHUB_WORKSPACE/work"

      - name: Instrument HarmonyOS kbase JOB_SUBMIT EINVAL
        run: python3 harmony42/apply_harmony42.py "$GITHUB_WORKSPACE/work/mesa/src/panfrost/lib/kmod/kbase_kmod.c"

      - name: Apply test of 72-byte full JM atom layout on Kirin 990
        run: python3 harmony42/apply_atom72.py "$GITHUB_WORKSPACE/work/mesa/src/panfrost/lib/kmod/kbase_kmod.c"

      - name: Apply Huawei G76 device-wide rotation compatibility
        run: python3 harmony42/apply_rotation_compat.py "$GITHUB_WORKSPACE/work/mesa/src/panfrost/vulkan/panvk_physical_device.c"

      - name: Cross-compile Android ARM64 Vulkan library
        run: sh scripts/build-android.sh "$GITHUB_WORKSPACE/work" '1.3.0-h42-atom72-rotfix2'

      - name: Build Winlator OpenGL memfd compatibility library
        shell: bash
        run: |
          set -euxo pipefail
          sh tools/winlator-gl/build.sh "$GITHUB_WORKSPACE/work/dist"
          test -s "$GITHUB_WORKSPACE/work/dist/libGL_memfd.so"
          file "$GITHUB_WORKSPACE/work/dist/libGL_memfd.so"

      - name: Pack ARMSX2 and standard variants
        shell: bash
        run: |
          set -euxo pipefail
          # Repack standard variant after building the OpenGL shim: it is
          # automatically included by pack.sh, but not in the ARMSX2 variant.
          sh scripts/pack.sh "$GITHUB_WORKSPACE/work/dist/libvulkan_panfrost.so" \
             '1.3.0-h42-atom72-rotfix2' "$GITHUB_WORKSPACE/work/dist"
          sh scripts/pack.sh "$GITHUB_WORKSPACE/work/dist/libvulkan_panfrost.so" \
             '1.3.0-h42-atom72-rotfix2' "$GITHUB_WORKSPACE/work/dist" armsx2
          unzip -Z -1 "$GITHUB_WORKSPACE/work/dist/panvk-g76-kirin990-1.3.0-h42-atom72-rotfix2.zip" |
            grep -Fx 'libGL_memfd.so'
          if unzip -Z -1 "$GITHUB_WORKSPACE/work/dist/panvk-g76-kirin990-1.3.0-h42-atom72-rotfix2-armsx2.zip" |
             grep -q 'libGL_memfd.so'; then
            echo "Unexpected Winlator shim inside ARMSX2 driver" >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          sha256sum *.zip > SHA256SUMS
          ls -lh *.zip

      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: panvk-h42-atom72-rotfix2-with-gl-arm64
          path: |
            work/dist/*.zip
            work/dist/SHA256SUMS
          if-no-files-found: error
