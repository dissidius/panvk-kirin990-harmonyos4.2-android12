name: Publish Kirin 990 H42 reusable Rust/Mesa builder
on:
  push:
    branches: [harmony42-rotation-universal-optimized-ci]
    paths:
      - 'ci/Dockerfile.h42-kirin990'
      - '.github/workflows/publish-h42-kirin990-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-h42-kirin990-builder
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reused host toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.h42-kirin990
          push: true
          tags: ghcr.io/dissidius/panvk-h42-kirin990-builder:llvm18-rust199-v1
          cache-from: type=gha,scope=h42-kirin990-builder-v1
          cache-to: type=gha,scope=h42-kirin990-builder-v1,mode=max
      - name: Verify published builder image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm ghcr.io/dissidius/panvk-h42-kirin990-builder:llvm18-rust199-v1 bash -lc '
            set -e
            rustc --version | grep "1.99.1"
            cargo --version
            bindgen --version
            cbindgen --version
            llvm-spirv-18 --help >/dev/null 2>&1 || test -x /usr/bin/llvm-spirv-18
            meson --version
            ninja --version
            command -v glslangValidator
            python3 -c "import mako, yaml, packaging"
          '
