name: Cache pinned NDK r28c (Kirin990)
on:
  push:
    branches: [harmony42-rotation-universal-optimized-ci]
    paths: [.github/workflows/h42-cache-ndk-r28c.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Restore exact Android NDK r28c
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: panvk-kirin990-ndk-r28c-28.2.13676358-linux-v1
      - name: Install NDK only if absent
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" ]; then
            echo "NDK r28c cached/installed. No network download."
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n1)"
            test -x "$SDKMANAGER"
            timeout 430s "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'ndk;28.2.13676358'
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          grep -E '^Pkg.Revision' "$NDK/source.properties"
          echo "Android NDK r28c installed and ready for cache"
